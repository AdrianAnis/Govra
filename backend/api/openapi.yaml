openapi: 3.1.0
info:
  title: Govra API
  version: 1.0.0
  description: >-
    Kontrak API Govra, platform transparansi proker pemerintah daerah dan pelaporan warga.
    Seluruh data contoh adalah data simulasi.
servers:
  - url: http://localhost:4010
    description: Mock Prism
tags:
  - {name: Referensi}
  - {name: Proker}
  - {name: Rapor}
  - {name: Isu}
  - {name: Laporan}
  - {name: Akun}
  - {name: Chatbot}
  - {name: Dinas}
  - {name: Admin}
security:
  - bffKey: []
paths:
  /region: {$ref: 'paths/reference.yaml#/region'}
  /districts: {$ref: 'paths/reference.yaml#/districts'}
  /goals: {$ref: 'paths/reference.yaml#/goals'}
  /opds: {$ref: 'paths/reference.yaml#/opds'}
  /opds/{slug}: {$ref: 'paths/reference.yaml#/opd'}
  /programs: {$ref: 'paths/programs.yaml#/list'}
  /programs/{code}: {$ref: 'paths/programs.yaml#/detail'}
  /scorecard: {$ref: 'paths/scorecard.yaml#/scorecard'}
  /scorecard/indicators/{code}/items: {$ref: 'paths/scorecard.yaml#/drill'}
  /methodology: {$ref: 'paths/scorecard.yaml#/methodology'}
  /issues: {$ref: 'paths/issues.yaml#/list'}
  /issues/{id}: {$ref: 'paths/issues.yaml#/detail'}
  /issues/{id}/support: {$ref: 'paths/issues.yaml#/support'}
  /reports: {$ref: 'paths/reports.yaml#/create'}
  /reports/duplicate-suggestions: {$ref: 'paths/reports.yaml#/duplicates'}
  /assistant/messages: {$ref: 'paths/assistant.yaml#/messages'}
  /me: {$ref: 'paths/me.yaml#/me'}
  /me/export: {$ref: 'paths/me.yaml#/export'}
  /me/reports: {$ref: 'paths/me.yaml#/reports'}
  /me/reports/{code}: {$ref: 'paths/me.yaml#/report'}
  /me/reports/{code}/resolution-feedback: {$ref: 'paths/me.yaml#/feedback'}
  /agency/issues: {$ref: 'paths/agency.yaml#/issues'}
  /agency/issues/{id}: {$ref: 'paths/agency.yaml#/issue'}
  /agency/issues/{id}/transitions: {$ref: 'paths/agency.yaml#/transition'}
  /agency/issues/{id}/evidence: {$ref: 'paths/agency.yaml#/evidence'}
  /agency/stats: {$ref: 'paths/agency.yaml#/stats'}
  /admin/overview: {$ref: 'paths/admin-queue.yaml#/overview'}
  /admin/verification: {$ref: 'paths/admin-queue.yaml#/verification'}
  /admin/issues/{id}/route: {$ref: 'paths/admin-queue.yaml#/route'}
  /admin/issues/{id}/reject: {$ref: 'paths/admin-queue.yaml#/reject'}
  /admin/users: {$ref: 'paths/admin-users.yaml#/users'}
  /admin/users/{id}: {$ref: 'paths/admin-users.yaml#/user'}
  /admin/opds: {$ref: 'paths/admin-master.yaml#/opds'}
  /admin/opds/{code}: {$ref: 'paths/admin-master.yaml#/opd'}
  /admin/opds/{code}/categories: {$ref: 'paths/admin-master.yaml#/categories'}
  /admin/categories/{code}: {$ref: 'paths/admin-master.yaml#/category'}
  /admin/districts: {$ref: 'paths/admin-master.yaml#/districts'}
  /admin/districts/{id}: {$ref: 'paths/admin-master.yaml#/district'}
  /admin/districts/{id}/villages: {$ref: 'paths/admin-master.yaml#/villages'}
  /admin/villages/{id}: {$ref: 'paths/admin-master.yaml#/village'}
  /admin/moderation/reports: {$ref: 'paths/admin-system.yaml#/moderation'}
  /admin/moderation/reports/{id}/hide: {$ref: 'paths/admin-system.yaml#/hide'}
  /admin/settings: {$ref: 'paths/admin-system.yaml#/settings'}
  /admin/settings/{key}: {$ref: 'paths/admin-system.yaml#/setting'}
  /admin/audit-logs: {$ref: 'paths/admin-system.yaml#/audit'}
components:
  securitySchemes:
    bffKey:
      type: apiKey
      in: header
      name: X-BFF-Key
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Role: {$ref: 'schemas/enums.yaml#/Role'}
    ProgramStatus: {$ref: 'schemas/enums.yaml#/ProgramStatus'}
    IssueStatus: {$ref: 'schemas/enums.yaml#/IssueStatus'}
    Urgency: {$ref: 'schemas/enums.yaml#/Urgency'}
    Visibility: {$ref: 'schemas/enums.yaml#/Visibility'}
    SafetyRisk: {$ref: 'schemas/enums.yaml#/SafetyRisk'}
    UserStatus: {$ref: 'schemas/enums.yaml#/UserStatus'}
    RejectionReason: {$ref: 'schemas/enums.yaml#/RejectionReason'}
    TransferReason: {$ref: 'schemas/enums.yaml#/TransferReason'}
    ModerationReason: {$ref: 'schemas/enums.yaml#/ModerationReason'}
    FeedbackOutcome: {$ref: 'schemas/enums.yaml#/FeedbackOutcome'}
    IndicatorCode: {$ref: 'schemas/enums.yaml#/IndicatorCode'}
    IndicatorUnit: {$ref: 'schemas/enums.yaml#/IndicatorUnit'}
