Region:
  type: object
  required: [name, head_label, is_simulation, period, bounds]
  properties:
    name: {type: string}
    head_label:
      type: string
      description: Label kepala daerah. Tidak pernah memuat nama atau foto sungguhan.
    is_simulation: {type: boolean}
    period:
      type: object
      required: [start_year, end_year]
      properties:
        start_year: {type: integer}
        end_year: {type: integer}
    bounds:
      type: array
      description: Batas wilayah [barat, selatan, timur, utara].
      minItems: 4
      maxItems: 4
      items: {type: number}
District:
  type: object
  required: [id, name, villages]
  properties:
    id: {$ref: 'common.yaml#/Uuid'}
    name: {type: string}
    villages:
      type: array
      items: {$ref: 'common.yaml#/AreaRef'}
DistrictList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {$ref: '#/District'}
Goal:
  type: object
  required: [code, name]
  properties:
    code: {$ref: 'common.yaml#/Code'}
    name: {type: string}
GoalList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {$ref: '#/Goal'}
OpdSummary:
  type: object
  required: [code, slug, name, categories, program_count, open_issue_count]
  properties:
    code: {$ref: 'common.yaml#/Code'}
    slug: {$ref: 'common.yaml#/Slug'}
    name: {type: string}
    categories:
      type: array
      items: {$ref: 'common.yaml#/CategoryRef'}
    program_count: {type: integer, minimum: 0}
    open_issue_count: {type: integer, minimum: 0}
OpdSummaryList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {$ref: '#/OpdSummary'}
OpdProfile:
  allOf:
    - $ref: '#/OpdSummary'
    - type: object
      required: [indicators, issue_stats]
      properties:
        indicators:
          type: array
          items: {$ref: 'scorecard.yaml#/IndicatorValue'}
        issue_stats:
          type: array
          items: {$ref: 'common.yaml#/StatusCount'}
