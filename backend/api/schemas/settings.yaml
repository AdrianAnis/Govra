Setting:
  type: object
  required: [key, label, value, unit]
  properties:
    key: {$ref: 'enums.yaml#/SettingKey'}
    label: {type: string}
    value: {type: number}
    unit: {$ref: 'enums.yaml#/SettingUnit'}
SettingList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: {$ref: '#/Setting'}
SettingUpdate:
  type: object
  required: [value]
  properties:
    value: {type: number}
