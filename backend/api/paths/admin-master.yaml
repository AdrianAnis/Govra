opds:
  get:
    operationId: listOpdsAdmin
    tags: [Admin]
    summary: Master OPD beserta kategori, termasuk yang nonaktif
    security:
      - bffKey: []
        bearer: []
    responses:
      '200':
        description: Daftar OPD
        content:
          application/json:
            schema: {$ref: '../schemas/admin-master.yaml#/OpdDetailList'}
            examples:
              admin: {$ref: '../examples/admin.yaml#/OpdDetailList'}
      default: {$ref: '../responses/error.yaml'}
  post:
    operationId: createOpd
    tags: [Admin]
    summary: Tambah OPD
    security:
      - bffKey: []
        bearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/admin-master.yaml#/CreateOpd'}
    responses:
      '201':
        description: OPD dibuat
        content:
          application/json:
            schema: {$ref: '../schemas/admin-master.yaml#/OpdDetail'}
            examples:
              admin: {$ref: '../examples/admin.yaml#/OpdDetail'}
      default: {$ref: '../responses/error.yaml'}
opd:
  patch:
    operationId: updateOpd
    tags: [Admin]
    summary: Ubah atau nonaktifkan OPD
    security:
      - bffKey: []
        bearer: []
    parameters:
      - $ref: '../parameters/common.yaml#/CodePath'
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/admin-master.yaml#/UpdateOpd'}
    responses:
      '200':
        description: OPD diperbarui
        content:
          application/json:
            schema: {$ref: '../schemas/admin-master.yaml#/OpdDetail'}
            examples:
              admin: {$ref: '../examples/admin.yaml#/OpdDetail'}
      default: {$ref: '../responses/error.yaml'}
